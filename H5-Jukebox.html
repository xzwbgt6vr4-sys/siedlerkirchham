<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H5 Jukebox">
<meta name="theme-color" content="#0d0d0d">
<title>H5 Jukebox</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d0d0d;color:#f0f0f0;font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom)}
#app{min-height:100vh;position:relative;overflow-x:hidden}
.noise{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:13px}
.logo-wrap{text-align:center;padding:14px 0 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.vinyl-logo{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#444,#111);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #f5c518,0 0 20px #f5c51830}
.vinyl-logo-inner{width:18px;height:18px;border-radius:50%;background:#0d0d0d;border:2px solid #555}
h1.logo{font-size:36px;font-weight:900;letter-spacing:.12em;color:#f5c518;text-shadow:0 0 28px #f5c51860;font-family:Impact,'Arial Black',sans-serif}
.logo-sub{color:#888;font-size:14px;letter-spacing:.08em}
.card{background:#222;border-radius:16px;padding:16px;border:1px solid #333}
.card-title{font-size:13px;font-weight:700;color:#f5c518;margin-bottom:11px;letter-spacing:.05em;font-family:Impact,sans-serif;text-transform:uppercase}
.mode-btn{width:100%;padding:13px 15px;border-radius:11px;border:1px solid #333;background:#1a1a1a;color:#f0f0f0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font-family:inherit;margin-bottom:8px}
.mode-btn:last-child{margin-bottom:0}
.mode-btn.active{background:#1a1400;border:2px solid #f5c518}
.mode-label{font-size:15px;font-weight:700}
.mode-desc{font-size:11px;color:#888}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.genre-btn{padding:9px 8px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#f0f0f0;cursor:pointer;font-size:12px;font-family:inherit;transition:all .1s;user-select:none}
.genre-btn.active{background:#f5c518;color:#000;border-color:#f5c518;font-weight:700}
.genre-btn.rand{grid-column:1/-1;background:#1a1a2e;border-color:#f5c518;color:#f5c518;font-weight:700}
.genre-btn.rand.active{background:#f5c518;color:#000}
.row-wrap{display:flex;flex-wrap:wrap;gap:7px}
.opt-btn{padding:7px 13px;border-radius:18px;border:1px solid #333;background:#1a1a1a;color:#f0f0f0;cursor:pointer;font-size:12px;font-family:inherit}
.opt-btn.active{background:#f5c518;color:#000;border-color:#f5c518;font-weight:700}
.big-btn{width:100%;padding:15px 18px;border-radius:13px;border:none;background:#f5c518;color:#000;font-weight:900;font-size:15px;letter-spacing:.08em;cursor:pointer;font-family:Impact,sans-serif;box-shadow:0 4px 18px #f5c51830;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.big-btn:disabled{opacity:.4}
.big-btn.red{background:#e63b2e;color:#fff}
.big-btn.green{background:#27ae60;color:#fff}
.big-btn.crimson{background:#e74c3c;color:#fff}
.ghost-btn{padding:11px 18px;border-radius:11px;border:1px solid #333;background:transparent;color:#888;font-size:13px;cursor:pointer;font-family:inherit}
.input-row{display:flex;gap:8px;margin-bottom:11px}
.text-input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#f0f0f0;font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none}
.add-btn{width:44px;height:44px;border-radius:10px;border:none;background:#f5c518;color:#000;font-size:22px;font-weight:900;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.player-list{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.player-chip{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:10px;background:#1a1a1a;border:1px solid #333}
.player-num{width:25px;height:25px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.remove-btn{margin-left:auto;background:none;border:none;color:#888;cursor:pointer;font-size:18px;padding:2px 6px}
.btn-row{display:flex;gap:10px;align-items:center}
.hint{color:#888;font-size:12px;text-align:center}
.progress-bar{height:4px;background:#333;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:#f5c518;border-radius:2px;transition:width .4s ease}
.round-label{color:#888;font-size:11px;text-align:center;letter-spacing:.03em}
.score-strip{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.score-chip{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:18px;background:#1a1a1a;border:1px solid #333;font-size:12px}
.score-chip.active{background:#f5c518;color:#000;border-color:#f5c518;font-weight:700}
.score-chip.buzz{background:#e63b2e;color:#fff;border-color:#e63b2e;font-weight:700;animation:buzzPulse .5s ease infinite}
.score-val{font-weight:700;font-size:14px}
.current-player{text-align:center;font-size:16px;padding:4px 0}
.vinyl-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0}
.vinyl{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#555,#111 60%,#222);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 4px #f5c518,0 0 0 8px #111,0 0 36px #f5c51840;user-select:none;touch-action:manipulation}
.vinyl.spinning{animation:spin 4s linear infinite}
.vinyl-inner{width:46px;height:46px;border-radius:50%;background:#0d0d0d;border:2px solid #555;display:flex;align-items:center;justify-content:center;color:#f5c518;font-size:26px;pointer-events:none}
.reveal-card{background:#222;border-radius:18px;padding:16px;border:2px solid #f5c518;display:flex;flex-direction:column;gap:11px;align-items:center}
.album-thumb{width:100px;height:100px;border-radius:11px;overflow:hidden;background:#1a1a1a;box-shadow:0 6px 28px #0008;flex-shrink:0}
.album-thumb img{width:100%;height:100%;object-fit:cover}
.track-info{text-align:center;width:100%}
.track-artist{color:#888;font-size:13px;margin-bottom:3px;letter-spacing:.05em}
.track-title{font-size:18px;font-weight:700;margin-bottom:5px;color:#f5c518}
.track-year{color:#f0f0f0;font-size:15px}
.result-btns{display:flex;gap:9px;width:100%}
.result-btns .big-btn{flex:1}
.result-flash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;pointer-events:none}
.result-flash.correct{background:rgba(0,165,78,.96)}
.result-flash.wrong{background:rgba(196,28,28,.96)}
.flash-emoji{font-size:76px}
.flash-text{font-size:22px;font-weight:900;color:#fff;font-family:Impact,sans-serif;letter-spacing:.05em;text-align:center;padding:0 22px}
.buzzer-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.buzzer-btn{padding:16px 10px;border-radius:15px;border:3px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;box-shadow:0 5px 20px #0007;min-height:96px;user-select:none;-webkit-user-select:none;transition:transform .08s;touch-action:manipulation}
.buzzer-btn:active{transform:scale(.92)}
.buzzer-btn:disabled{opacity:.35;transform:none}
.buzzer-icon{font-size:30px;pointer-events:none}
.buzzer-name{font-size:14px;font-weight:700;text-align:center;word-break:break-word;pointer-events:none}
.buzzer-judge{background:#150f00;border:2px solid #f5c518;border-radius:15px;padding:16px;display:flex;flex-direction:column;gap:11px;align-items:center}
.buzzer-winner-badge{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(245,197,24,.1);border-radius:11px;padding:14px 20px;width:100%}
.buzzer-winner-name{font-size:20px;font-weight:900;color:#f5c518}
.buzzer-winner-sub{font-size:12px;color:#aaa}
.trophy{font-size:68px;text-align:center;padding-top:14px}
.result-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #333}
.result-rank{font-size:22px;width:34px}
.result-name{flex:1;font-size:15px}
.result-score{color:#f5c518;font-weight:700;font-size:15px}
.screen{display:none}
.screen.active{display:block}
.genre-hint{color:#f5c518;font-size:12px;text-align:center;margin-bottom:9px}
.home-btn{position:fixed;top:env(safe-area-inset-top,14px);left:14px;margin-top:14px;z-index:50;background:#1a1a1a;border:1px solid #444;border-radius:10px;color:#aaa;font-size:13px;padding:7px 13px;cursor:pointer;font-family:inherit;display:none;touch-action:manipulation}
.home-btn.visible{display:block}
.confirm-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px}
.confirm-overlay.open{display:flex}
.confirm-box{background:#222;border:1px solid #555;border-radius:18px;padding:26px 22px;max-width:320px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.confirm-title{font-size:17px;font-weight:700;color:#f0f0f0}
.confirm-sub{font-size:13px;color:#888;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes buzzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<div id="app">
<div class="noise"></div>

<!-- Home button (visible during game) -->
<button class="home-btn" id="home-btn">🏠 Menu</button>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Spiel beenden?</div>
    <div class="confirm-sub">Der aktuelle Spielstand geht verloren.</div>
    <div class="confirm-btns">
      <button class="ghost-btn" id="confirm-cancel" style="flex:1">▶ Weiter spielen</button>
      <button class="big-btn red" id="confirm-yes" style="flex:1">🏠 Zum Menue</button>
    </div>
  </div>
</div>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
<div class="container">
  <div class="logo-wrap">
    <div class="vinyl-logo"><div class="vinyl-logo-inner"></div></div>
    <h1 class="logo">H5 JUKEBOX</h1>
    <p class="logo-sub">Das Musik-Ratespiel</p>
  </div>
  <div class="card">
    <div class="card-title">Spielmodus</div>
    <button class="mode-btn active" data-mode="reihum">
      <span class="mode-label">🎤 Reihum</span>
      <span class="mode-desc">Jeder Spieler ist abwechselnd dran</span>
    </button>
    <button class="mode-btn" data-mode="schnellster">
      <span class="mode-label">⚡ Wer ist der Schnellste?</span>
      <span class="mode-desc">Alle gleichzeitig - wer zuerst drueckt, bekommt den Punkt</span>
    </button>
  </div>
  <div class="card">
    <div class="card-title">🎵 Genre</div>
    <div id="genre-hint" class="genre-hint" style="display:none"></div>
    <div class="genre-grid" id="genre-grid">
      <button class="genre-btn rand active" data-genre="random">🎲 Zufaellig</button>
      <button class="genre-btn" data-genre="pop">🎤 Pop</button>
      <button class="genre-btn" data-genre="rock">🎸 Rock</button>
      <button class="genre-btn" data-genre="hiphop">🎧 Hip-Hop</button>
      <button class="genre-btn" data-genre="electronic">🎛️ Electronic</button>
      <button class="genre-btn" data-genre="jazz">🎷 Jazz</button>
      <button class="genre-btn" data-genre="klassik">🎻 Klassik</button>
      <button class="genre-btn" data-genre="schlager">🌻 Schlager</button>
      <button class="genre-btn" data-genre="rnb">🎶 R&amp;B / Soul</button>
      <button class="genre-btn" data-genre="metal">🤘 Metal</button>
      <button class="genre-btn" data-genre="filmmusik">🎬 Filmmusik</button>
      <button class="genre-btn" data-genre="ballermann">🍺 Ballermann</button>
      <button class="genre-btn" data-genre="kinder">🧸 Kinder</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📅 Zeitraum</div>
    <div class="row-wrap" id="decade-group">
      <button class="opt-btn" data-years="10">🕐 Letzte 10 Jahre</button>
      <button class="opt-btn active" data-years="20">🕑 Letzte 20 Jahre</button>
      <button class="opt-btn" data-years="50">🕔 Letzte 50 Jahre</button>
      <button class="opt-btn" data-years="100">🕙 Letzte 100 Jahre</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🏆 Chart-Platzierung</div>
    <div class="row-wrap" id="chart-group">
      <button class="opt-btn active" data-chart="0">🎵 Egal</button>
      <button class="opt-btn" data-chart="10">🥇 Top 10</button>
      <button class="opt-btn" data-chart="50">🥈 Top 50</button>
      <button class="opt-btn" data-chart="100">🥉 Top 100</button>
    </div>
  </div>
  <button class="big-btn" id="btn-to-players">👥 SPIELER EINGEBEN</button>
</div>
</div>

<!-- PLAYERS -->
<div id="screen-players" class="screen">
<div class="container">
  <h1 class="logo" style="text-align:center;padding-top:14px">H5 JUKEBOX</h1>
  <p class="logo-sub" style="text-align:center">Wer spielt mit?</p>
  <div class="card">
    <div class="input-row">
      <input class="text-input" id="player-input" type="text" placeholder="Name eingeben..." maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="words">
      <button class="add-btn" id="btn-add-player">+</button>
    </div>
    <div class="player-list" id="player-list">
      <p class="hint" id="player-hint">Mindestens 2 Spieler hinzufuegen</p>
    </div>
  </div>
  <div class="btn-row">
    <button class="ghost-btn" id="btn-back-setup">Zurueck</button>
    <button class="big-btn" id="btn-start-game" disabled style="flex:1">🎲 SPIEL STARTEN</button>
  </div>
  <p class="hint" id="start-hint" style="display:none">Startspieler wird zufaellig gewaehlt!</p>
</div>
</div>

<!-- GAME REIHUM -->
<div id="screen-game" class="screen">
<div class="container">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <p class="round-label" id="round-label"></p>
  <div class="score-strip" id="score-strip"></div>
  <p class="current-player" id="current-player"></p>
  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl-btn"><div class="vinyl-inner" id="vinyl-icon">&#9654;</div></div>
  </div>
  <p class="hint" id="game-hint"></p>
  <button class="big-btn red" id="btn-reveal" disabled>🔍 AUFLOESEN</button>
  <div class="reveal-card" id="reveal-card" style="display:none">
    <div class="album-thumb"><img id="album-img" src="" alt="" style="display:none"></div>
    <div class="track-info">
      <p class="track-artist" id="track-artist"></p>
      <p class="track-title" id="track-title-el"></p>
      <p class="track-year" id="track-year"></p>
    </div>
    <div class="result-btns">
      <button class="big-btn green" id="btn-correct">✅ Richtig</button>
      <button class="big-btn crimson" id="btn-wrong">❌ Falsch</button>
    </div>
  </div>
  <button class="ghost-btn" id="btn-reload-game" style="display:none;align-self:center">🔄 Neu laden</button>
</div>
<div id="result-flash-game" class="result-flash" style="display:none">
  <span class="flash-emoji" id="flash-emoji-game"></span>
  <span class="flash-text" id="flash-text-game"></span>
</div>
</div>

<!-- GAME SCHNELLSTER -->
<div id="screen-schnellster" class="screen">
<div class="container">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill-s"></div></div>
  <p class="round-label" id="round-label-s"></p>
  <div class="score-strip" id="score-strip-s"></div>
  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl-btn-s"><div class="vinyl-inner" id="vinyl-icon-s">&#9654;</div></div>
  </div>
  <p class="hint" id="schnell-hint"></p>
  <div class="buzzer-grid" id="buzzer-grid"></div>
  <div class="buzzer-judge" id="buzzer-judge" style="display:none">
    <div class="buzzer-winner-badge">
      <span style="font-size:34px">&#9889;</span>
      <span class="buzzer-winner-name" id="buzzer-winner-name"></span>
      <span class="buzzer-winner-sub">hat als Erstes gedrueckt!</span>
    </div>
    <div class="result-btns">
      <button class="big-btn green" id="btn-buzz-correct">✅ Richtig</button>
      <button class="big-btn crimson" id="btn-buzz-wrong">❌ Falsch</button>
    </div>
  </div>
  <div class="reveal-card" id="reveal-card-s" style="display:none">
    <div class="album-thumb"><img id="album-img-s" src="" alt="" style="display:none"></div>
    <div class="track-info">
      <p class="track-artist" id="track-artist-s"></p>
      <p class="track-title" id="track-title-s"></p>
      <p class="track-year" id="track-year-s"></p>
    </div>
  </div>
  <button class="big-btn" id="btn-next-round" style="display:none">▶ Naechste Runde</button>
  <button class="ghost-btn" id="btn-reload-s" style="display:none;align-self:center">🔄 Neu laden</button>
</div>
<div id="result-flash-s" class="result-flash" style="display:none">
  <span class="flash-emoji" id="flash-emoji-s"></span>
  <span class="flash-text" id="flash-text-s"></span>
</div>
</div>

<!-- SCORE -->
<div id="screen-score" class="screen">
<div class="container">
  <div class="trophy">&#127942;</div>
  <h1 class="logo" style="text-align:center">ERGEBNIS</h1>
  <p class="logo-sub" id="winner-label" style="text-align:center"></p>
  <div class="card" id="score-list"></div>
  <button class="big-btn" id="btn-restart">🔄 NOCHMAL SPIELEN</button>
</div>
</div>

<audio id="audio" playsinline></audio>
</div>

<script>
// iTunes Search API - CORS-safe, works from local files on iPhone
var GENRE_TERMS = {
  random:     ["pop hit","rock classic","hip hop","dance","schlager"],
  pop:        ["pop"],
  rock:       ["rock"],
  hiphop:     ["hip hop rap"],
  electronic: ["electronic dance EDM"],
  jazz:       ["jazz"],
  klassik:    ["classical orchestra symphony"],
  schlager:   ["schlager"],
  rnb:        ["R&B soul"],
  metal:      ["heavy metal"],
  filmmusik:  ["movie soundtrack","film score theme"],
  ballermann: ["malle party schlager"],
  kinder:     ["kinderlieder kinder"]
};

var BUZZER_COLORS = ["#c0392b","#2980b9","#27ae60","#8e44ad","#d35400","#16a085","#b7950b","#34495e"];

var state = {
  gameMode: "reihum",
  selectedGenres: ["random"],
  decadeYears: 20,
  players: [],
  scores: {},
  round: 1,
  totalRounds: 10,
  currentPlayerIdx: 0,
  track: null,
  playing: false,
  loading: false,
  revealed: false,
  buzzerWinner: null,
  buzzerLocked: false
};

var audio = document.getElementById("audio");
audio.addEventListener("ended", function() { state.playing = false; updateVinyl(); });

// -- Screen routing ------------------------------------------------------------
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById("screen-" + id).classList.add("active");
  window.scrollTo(0, 0);
  var gameScreens = ["game", "schnellster"];
  var homeBtn = document.getElementById("home-btn");
  if (gameScreens.indexOf(id) >= 0) homeBtn.classList.add("visible");
  else homeBtn.classList.remove("visible");
}

// -- iTunes API (JSONP - works from file:// on iPhone) ------------------------
function fetchSong(term, minYear, maxYear) {
  return new Promise(function(resolve, reject) {
    var cbName = "itcb_" + Date.now() + "_" + Math.floor(Math.random()*99999);
    var script = document.createElement("script");
    var done = false;

    window[cbName] = function(data) {
      done = true;
      delete window[cbName];
      if (document.head.contains(script)) document.head.removeChild(script);
      var results = (data.results || []).filter(function(t) {
        if (!t.previewUrl) return false;
        var year = parseInt((t.releaseDate || "").slice(0, 4));
        return year >= minYear && year <= maxYear;
      });
      if (!results.length) { reject(new Error("No valid tracks")); return; }
      resolve(results[Math.floor(Math.random() * results.length)]);
    };

    script.onerror = function() {
      if (!done) { done = true; delete window[cbName]; reject(new Error("Script error")); }
    };

    var url = "https://itunes.apple.com/search?term=" + encodeURIComponent(term)
      + "&media=music&entity=song&limit=50&country=de&callback=" + cbName;
    script.src = url;
    document.head.appendChild(script);

    // Timeout nach 10 Sekunden
    setTimeout(function() {
      if (!done) {
        done = true;
        delete window[cbName];
        if (document.head.contains(script)) document.head.removeChild(script);
        reject(new Error("Timeout"));
      }
    }, 10000);
  });
}

function shuffle(arr){ return arr.slice().sort(function(){ return Math.random()-.5; }); }

// -- Setup screen --------------------------------------------------------------
document.querySelectorAll(".mode-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll(".mode-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    state.gameMode = btn.dataset.mode;
  });
});

document.querySelectorAll("#genre-grid .genre-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    var id = btn.dataset.genre;
    var randBtn = document.querySelector(".genre-btn.rand");
    if (id === "random") {
      document.querySelectorAll("#genre-grid .genre-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      state.selectedGenres = ["random"];
    } else {
      randBtn.classList.remove("active");
      state.selectedGenres = state.selectedGenres.filter(function(g){ return g !== "random"; });
      if (btn.classList.contains("active")) {
        btn.classList.remove("active");
        state.selectedGenres = state.selectedGenres.filter(function(g){ return g !== id; });
        if (!state.selectedGenres.length) {
          state.selectedGenres = ["random"];
          randBtn.classList.add("active");
        }
      } else {
        btn.classList.add("active");
        state.selectedGenres.push(id);
      }
    }
    var hint = document.getElementById("genre-hint");
    var isRand = state.selectedGenres[0] === "random";
    hint.style.display = isRand ? "none" : "block";
    if (!isRand) hint.textContent = state.selectedGenres.length + " Kategorie" + (state.selectedGenres.length > 1 ? "n" : "") + " gewaehlt";
  });
});

document.querySelectorAll("#decade-group .opt-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll("#decade-group .opt-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    state.decadeYears = parseInt(btn.dataset.years);
  });
});

document.querySelectorAll("#chart-group .opt-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll("#chart-group .opt-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
  });
});

document.getElementById("btn-to-players").addEventListener("click", function(){ showScreen("players"); });

// -- Players screen ------------------------------------------------------------
function renderPlayers() {
  var list = document.getElementById("player-list");
  var startBtn = document.getElementById("btn-start-game");
  list.innerHTML = "";
  if (!state.players.length) {
    var h = document.createElement("p");
    h.className = "hint";
    h.textContent = "Mindestens 2 Spieler hinzufuegen";
    list.appendChild(h);
  } else {
    state.players.forEach(function(p, i){
      var chip = document.createElement("div");
      chip.className = "player-chip";
      var num = document.createElement("span");
      num.className = "player-num";
      num.style.background = BUZZER_COLORS[i % BUZZER_COLORS.length];
      num.textContent = i + 1;
      var name = document.createElement("span");
      name.textContent = p;
      var del = document.createElement("button");
      del.className = "remove-btn";
      del.textContent = "x";
      del.onclick = function(){ state.players = state.players.filter(function(x){ return x !== p; }); renderPlayers(); };
      chip.appendChild(num); chip.appendChild(name); chip.appendChild(del);
      list.appendChild(chip);
    });
  }
  startBtn.disabled = state.players.length < 2;
  startBtn.style.opacity = state.players.length < 2 ? "0.4" : "1";
  document.getElementById("start-hint").style.display = state.players.length >= 2 ? "block" : "none";
}

function addPlayer() {
  var inp = document.getElementById("player-input");
  var name = inp.value.trim();
  if (!name || state.players.indexOf(name) >= 0) return;
  state.players.push(name);
  inp.value = "";
  renderPlayers();
  inp.focus();
}

document.getElementById("btn-add-player").addEventListener("click", addPlayer);
document.getElementById("player-input").addEventListener("keydown", function(e){ if (e.key === "Enter") addPlayer(); });
document.getElementById("btn-back-setup").addEventListener("click", function(){ showScreen("setup"); });

document.getElementById("btn-start-game").addEventListener("click", function(){
  if (state.players.length < 2) return;
  state.players = shuffle(state.players);
  state.scores = {};
  state.players.forEach(function(p){ state.scores[p] = 0; });
  state.currentPlayerIdx = 0;
  state.round = 1;
  if (state.gameMode === "schnellster") {
    showScreen("schnellster");
    buildBuzzers();
    loadTrack("s");
  } else {
    showScreen("game");
    loadTrack("r");
  }
});

// -- Audio ---------------------------------------------------------------------
function stopAudio() {
  audio.pause();
  audio.currentTime = 0;
  state.playing = false;
}

function updateVinyl() {
  var sfx = state.gameMode === "schnellster" ? "s" : "r";
  var vinyl = document.getElementById(sfx === "s" ? "vinyl-btn-s" : "vinyl-btn");
  var icon  = document.getElementById(sfx === "s" ? "vinyl-icon-s" : "vinyl-icon");
  if (!vinyl) return;
  if (state.loading)  { vinyl.classList.remove("spinning"); icon.innerHTML = "&#8987;"; return; }
  if (state.playing)  { vinyl.classList.add("spinning");    icon.innerHTML = "&#9646;&#9646;"; }
  else                { vinyl.classList.remove("spinning"); icon.innerHTML = "&#9654;"; }
}

// -- Load track ----------------------------------------------------------------
function loadTrack(sfx) {
  sfx = sfx || (state.gameMode === "schnellster" ? "s" : "r");
  state.loading = true; state.track = null; state.revealed = false;
  state.buzzerWinner = null; state.buzzerLocked = false;
  stopAudio();
  updateVinyl();
  hideFlash(sfx);

  if (sfx === "s") {
    el("reveal-card-s").style.display = "none";
    el("buzzer-judge").style.display = "none";
    el("buzzer-grid").style.display = "grid";
    el("btn-reload-s").style.display = "none";
    el("btn-next-round").style.display = "none";
    el("schnell-hint").textContent = "Tippen zum Starten";
    setBuzzersDisabled(false);
    renderScoreS();
    renderRoundS();
  } else {
    el("reveal-card").style.display = "none";
    el("btn-reveal").style.display = "block";
    el("btn-reveal").disabled = true;
    el("btn-reload-game").style.display = "none";
    el("game-hint").textContent = "Tippen zum Abspielen";
    el("current-player").innerHTML = "von: <strong>" + state.players[state.currentPlayerIdx] + "</strong>";
    renderScore();
    renderRound();
  }

  var maxYear = new Date().getFullYear();
  var minYear = maxYear - state.decadeYears;
  var genres = state.selectedGenres;
  var picked = genres[Math.floor(Math.random() * genres.length)];
  var terms = GENRE_TERMS[picked] || ["pop hit"];
  var term = terms[Math.floor(Math.random() * terms.length)];
  var fallbackTerms = ["pop", "rock", "dance", "hits", "chart"];
  var fallbackTerm = fallbackTerms[Math.floor(Math.random() * fallbackTerms.length)];

  function tryFetch(searchTerm, isRetry) {
    fetchSong(searchTerm, minYear, maxYear)
      .then(function(t){
        state.track = t;
        state.loading = false;
        audio.src = t.previewUrl;
        audio.load();
        var playPromise = audio.play();
        if (playPromise) playPromise.then(function(){ state.playing = true; updateVinyl(); }).catch(function(){ state.playing = false; updateVinyl(); });
        else { state.playing = true; }
        updateVinyl();
        if (sfx === "s") {
          el("schnell-hint").textContent = "🎵 Song laeuft - wer kennt ihn? Jetzt druecken!";
          setBuzzersDisabled(false);
        } else {
          el("btn-reveal").disabled = false;
          el("game-hint").textContent = "🎵 Song laeuft... Wer kennt ihn?";
        }
      })
      .catch(function(err){
        if (!isRetry) {
          // Automatisch nochmal mit Fallback-Begriff versuchen
          if (sfx === "s") el("schnell-hint").textContent = "⏳ Suche Song...";
          else el("game-hint").textContent = "⏳ Suche Song...";
          tryFetch(fallbackTerm, true);
        } else {
          state.loading = false;
          updateVinyl();
          if (sfx === "s") { el("btn-reload-s").style.display = "block"; el("schnell-hint").textContent = "Kein Song gefunden. Bitte Internetverbindung pruefen."; }
          else { el("btn-reload-game").style.display = "block"; el("game-hint").textContent = "Kein Song gefunden. Bitte Internetverbindung pruefen."; }
        }
      });
  }

  tryFetch(term, false);
}

function el(id){ return document.getElementById(id); }

// -- Reihum game ---------------------------------------------------------------
function renderScore() {
  var strip = el("score-strip");
  strip.innerHTML = "";
  state.players.forEach(function(p, i){
    var chip = document.createElement("div");
    chip.className = "score-chip" + (i === state.currentPlayerIdx ? " active" : "");
    chip.innerHTML = "<span>" + p + "</span><span class='score-val'>" + state.scores[p] + "</span>";
    strip.appendChild(chip);
  });
}

function renderRound() {
  el("round-label").textContent = "Runde " + state.round + " / " + state.totalRounds + "  |  Reihum";
  el("progress-fill").style.width = (((state.round-1) / state.totalRounds) * 100) + "%";
}

el("vinyl-btn").addEventListener("click", function(){
  if (state.loading || !state.track) return;
  if (state.playing) { audio.pause(); state.playing = false; }
  else { audio.play(); state.playing = true; }
  updateVinyl();
});

el("btn-reveal").addEventListener("click", function(){
  stopAudio(); state.revealed = true;
  el("btn-reveal").style.display = "none";
  el("game-hint").textContent = "";
  showReveal("r");
});

el("btn-correct").addEventListener("click", function(){ handleResult(true); });
el("btn-wrong").addEventListener("click",   function(){ handleResult(false); });
el("btn-reload-game").addEventListener("click", function(){ loadTrack("r"); });

function handleResult(correct) {
  var cp = state.players[state.currentPlayerIdx];
  if (correct) state.scores[cp]++;
  showFlash("r", correct, correct ? "Richtig!" : "Falsch!");
  setTimeout(function(){ hideFlash("r"); advanceRound(); }, 1300);
}

function advanceRound() {
  var next = state.round + 1;
  if (next > state.totalRounds) { stopAudio(); showScoreScreen(); return; }
  state.round = next;
  state.currentPlayerIdx = (state.currentPlayerIdx + 1) % state.players.length;
  if (state.gameMode === "schnellster") loadTrack("s");
  else loadTrack("r");
}

// -- Schnellster game ----------------------------------------------------------
function buildBuzzers() {
  var grid = el("buzzer-grid");
  grid.innerHTML = "";
  state.players.forEach(function(p, i){
    var btn = document.createElement("button");
    btn.className = "buzzer-btn";
    btn.style.background = BUZZER_COLORS[i % BUZZER_COLORS.length];
    btn.innerHTML = "<span class='buzzer-icon'>&#128276;</span><span class='buzzer-name'>" + p + "</span>";
    btn.dataset.player = p;
    btn.addEventListener("click", function(){ handleBuzzer(p); });
    grid.appendChild(btn);
  });
}

function setBuzzersDisabled(off) {
  document.querySelectorAll("#buzzer-grid .buzzer-btn").forEach(function(b){ b.disabled = off; });
}

function renderScoreS() {
  var strip = el("score-strip-s");
  strip.innerHTML = "";
  state.players.forEach(function(p){
    var chip = document.createElement("div");
    chip.className = "score-chip" + (p === state.buzzerWinner ? " buzz" : "");
    chip.innerHTML = "<span>" + p + "</span><span class='score-val'>" + state.scores[p] + "</span>";
    strip.appendChild(chip);
  });
}

function renderRoundS() {
  el("round-label-s").textContent = "Runde " + state.round + " / " + state.totalRounds + "  |  Wer ist der Schnellste?";
  el("progress-fill-s").style.width = (((state.round-1) / state.totalRounds) * 100) + "%";
}

el("vinyl-btn-s").addEventListener("click", function(){
  if (state.loading || !state.track) return;
  if (state.playing) { audio.pause(); state.playing = false; }
  else { audio.play(); state.playing = true; }
  updateVinyl();
});

function handleBuzzer(playerName) {
  if (state.buzzerLocked || state.revealed) return;
  state.buzzerWinner = playerName;
  state.buzzerLocked = true;
  stopAudio(); updateVinyl();
  renderScoreS();
  setBuzzersDisabled(true);
  el("buzzer-grid").style.display = "none";
  el("buzzer-winner-name").textContent = playerName;
  el("buzzer-judge").style.display = "flex";
  el("schnell-hint").textContent = "";
}

el("btn-buzz-correct").addEventListener("click", function(){ handleBuzzerResult(true); });
el("btn-buzz-wrong").addEventListener("click",   function(){ handleBuzzerResult(false); });
el("btn-reload-s").addEventListener("click", function(){ loadTrack("s"); });
el("btn-next-round").addEventListener("click", function(){ advanceRound(); });

function handleBuzzerResult(correct) {
  if (correct && state.buzzerWinner) state.scores[state.buzzerWinner]++;
  var label = correct
    ? state.buzzerWinner + " liegt richtig! +1 Punkt"
    : state.buzzerWinner + " lag falsch!";
  showFlash("s", correct, label);
  state.revealed = true;
  el("buzzer-judge").style.display = "none";
  setTimeout(function(){
    hideFlash("s");
    showReveal("s");
    el("btn-next-round").style.display = "block";
  }, 1400);
}

// -- Reveal card ---------------------------------------------------------------
function showReveal(sfx) {
  var t = state.track;
  if (!t) return;
  var isS = sfx === "s";
  var artistEl = el(isS ? "track-artist-s" : "track-artist");
  var titleEl  = el(isS ? "track-title-s"  : "track-title-el");
  var yearEl   = el(isS ? "track-year-s"   : "track-year");
  var imgEl    = el(isS ? "album-img-s"    : "album-img");
  var card     = el(isS ? "reveal-card-s"  : "reveal-card");
  artistEl.textContent = t.artistName || "";
  titleEl.textContent  = t.trackName  || "";
  yearEl.textContent   = "Jahr: " + (t.releaseDate ? t.releaseDate.slice(0,4) : "?");
  var art = t.artworkUrl100 || t.artworkUrl60 || "";
  if (art) { imgEl.src = art.replace("100x100", "200x200"); imgEl.style.display = "block"; }
  else { imgEl.style.display = "none"; }
  card.style.display = "flex";
}

// -- Flash overlay -------------------------------------------------------------
function showFlash(sfx, correct, text) {
  var fid = sfx === "s" ? "result-flash-s"   : "result-flash-game";
  var eid = sfx === "s" ? "flash-emoji-s"     : "flash-emoji-game";
  var tid = sfx === "s" ? "flash-text-s"      : "flash-text-game";
  var fel = el(fid);
  el(eid).textContent = correct ? "OK" : "X";
  el(tid).textContent = text;
  fel.className = "result-flash " + (correct ? "correct" : "wrong");
  fel.style.display = "flex";
}
function hideFlash(sfx) {
  el(sfx === "s" ? "result-flash-s" : "result-flash-game").style.display = "none";
}

// -- Score screen --------------------------------------------------------------
function showScoreScreen() {
  var sorted = state.players.slice().sort(function(a,b){ return state.scores[b]-state.scores[a]; });
  el("winner-label").innerHTML = "<strong>" + sorted[0] + "</strong> gewinnt!";
  var medals = ["1.", "2.", "3."];
  el("score-list").innerHTML = sorted.map(function(p,i){
    return '<div class="result-row"><span class="result-rank">' + (medals[i]||((i+1)+"."))
      + '</span><span class="result-name">' + p
      + '</span><span class="result-score">' + state.scores[p] + ' Punkte</span></div>';
  }).join("");
  showScreen("score");
}

el("btn-restart").addEventListener("click", function(){
  state.players = []; state.scores = {}; state.round = 1; state.track = null;
  stopAudio(); renderPlayers(); showScreen("setup");
});

// -- Home button & confirm dialog ----------------------------------------------
document.getElementById("home-btn").addEventListener("click", function(){
  document.getElementById("confirm-overlay").classList.add("open");
});
document.getElementById("confirm-cancel").addEventListener("click", function(){
  document.getElementById("confirm-overlay").classList.remove("open");
});
document.getElementById("confirm-yes").addEventListener("click", function(){
  document.getElementById("confirm-overlay").classList.remove("open");
  stopAudio();
  state.players = []; state.scores = {}; state.round = 1; state.track = null;
  hideFlash("r"); hideFlash("s");
  renderPlayers();
  showScreen("setup");
});

// -- Init ----------------------------------------------------------------------
renderPlayers();
</script>
</body>
</html>
